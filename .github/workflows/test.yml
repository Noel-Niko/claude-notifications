name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run unit tests
        run: uv run pytest -m "not integration" -v
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Run Ruff Code Validation
        run: uvx ruff check . --verbose --show-files --extend-select TD
      - name: Run Ruff Format Check
        run: uvx ruff format --check
      - name: Ruff Failure Guidance
        if: failure()
        run: |
          echo ""
          echo "❌ Ruff checks failed!"
          echo ""
          echo "🔧 Upgrade your local Ruff to match CI/CD version:"
          echo "   uv tool install ruff"
          echo ""
        continue-on-error: true
